[general]
live_config_reload = false

[font]
size = 6.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[colors.primary]
background = "#000000"
foreground = "#CCFF00"

[colors.normal]
black   = "#000000"  # color 0
red     = "#00ADD8"  # color 1
green   = "#FF1493"  # color 2
yellow  = "#00ADD8"  # color 3
blue    = "#CCFF00"  # color 4
magenta = "#CCFF00"  # color 5
cyan    = "#FF1493"  # color 6
white   = "#CCFF00"  # color 7

[colors.bright]
black   = "#00ADD8"  # color 8
red     = "#FF1493"  # color 9
green   = "#FF1493"  # color 10
yellow  = "#FF1493"  # color 11
blue    = "#00ADD8"  # color 12
magenta = "#FF1493"  # color 13
cyan    = "#CCFF00"  # color 14
white   = "#FFFFFF"  # color 15

[cursor]
style = { shape = "Beam", blinking = "Always" }

[window]
opacity = 1.0
blur = false

[window.dimensions]
columns = 88
lines = 28
