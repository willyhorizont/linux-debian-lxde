# /etc/polybar
# https://github.com/polybar/polybar/wiki/Module:-i3

[bar/workspace-switcher]
override-redirect = true
wm-restack = i3
bottom = true
fixed-center = false
width = 100%
height = 18
offset-x = 0
offset-y = 0

background = #FFFFFF
foreground = #000000
font-0 = "JetBrains Mono:style=Bold:size=8;2"

modules-left = i3

[module/i3]
type = internal/i3
pin-workspaces = true
enable-click = true
enable-scroll = false

format = <label-state> <label-mode>

label-focused = " %name% "
label-focused-foreground = #000000
label-focused-background = #00ADD8
label-focused-padding = 0

label-visible = " %name% "
label-visible-foreground = #CCFF00
label-visible-background = #000000
label-visible-padding = 0

label-unfocused = " %name% "
label-unfocused-foreground = #CCFF00
label-unfocused-background = #000000
label-unfocused-padding = 0

label-urgent = " %name% "
label-urgent-foreground = #000000
label-urgent-background = #FF1493
label-urgent-padding = 0

label-mode = " %mode% "
label-mode-foreground = #000000
label-mode-background = #00ADD8
label-mode-padding = 0

label-separator = "|"
label-separator-foreground = #FF1493
label-separator-background = #000000
label-separator-padding = 0
