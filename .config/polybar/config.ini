# /etc/polybar

[colors]
background = #FFFFFF
foreground = #000000
active = #00ADD8
inactive = #888888

[bar/i3switcher]
override-redirect = true

wm-restack = i3

bottom = true
fixed-center = false
width = 100%
height = 18
offset-x = 0
offset-y = 0

background = ${colors.background}
foreground = ${colors.foreground}
font-0 = "JetBrains Mono:style=Bold:size=8;2"

modules-left = i3

[module/i3]
type = internal/i3
pin-workspaces = true
enable-click = true
enable-scroll = false

format = <label-state> <label-mode>

label-focused = %name%
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.active}
label-focused-padding = 1

label-visible = %name%
label-visible-foreground = #ffffff
label-visible-background = #333333
label-visible-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.inactive}
label-unfocused-padding = 1

label-urgent = %name%
label-urgent-foreground = #ffffff
label-urgent-background = #900000
label-urgent-padding = 1

label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = #000000
label-mode-background = ${colors.active}
